mages/00000000-0000-4000-8000-000000000006-36.jpg/250x188.webp","https://images.example.com/listing-images/00000000-0000-4000-8000-000000000006-37.jpg/250x188.webp","https://images.example.com/listing-images/00000000-0000-4000-8000-000000000006-38.jpg/250x188.webp"],"description":"Toyota RAV4 Hybride Rechargeable SE AWD 2025\u003cbr />\u003cstrong>Puissant, économique et prêt pour toutes les aventures, le Toyota RAV4 Hybride Rechargeable SE AWD 2025 offre des performances remarquables, des technologies avancées et des économies de carburant exceptionnelles dans un VUS polyvalent.\u003c/strong> Grâce à sa motorisation hybride rechargeable de nouvelle génération et à sa traction intégrale de série, il est conçu pour répondre aux besoins des trajets quotidiens comme des longues escapades.\u003cbr />Performance et efficacité\u003cbr />\u003cul>\u003cli>Motorisation hybride rechargeable 4 cylindres de 2,5 L\u003c/li>\u003cli>302 chevaux combinés\u003c/li>\u003cli>Traction intégrale électronique sur demande (AWD)\u003c/li>\u003cli>Transmission à variation continue électronique (eCVT)\u003c/li>\u003cli>Jusqu&#x27;à 68 km d&#x27;autonomie en mode 100 % électrique\u003c/li>\u003cli>Excellente efficacité énergétique\u003c/li>\u003cli>Accélération impressionnante\u003c/li>\u003cli>Modes de conduite EV, Hybride, Éco et Sport\u003c/li>\u003cli>Système de freinage régénératif\u003c/li>\u003cli>Capacité de remorquage jusqu&#x27;à 2 500 lb\u003c/li>\u003c/ul>Équipements extérieurs\u003cbr />\u003cul>\u003cli>Design moderne et dynamique du RAV4\u003c/li>\u003cli>Phares projecteurs à DEL\u003c/li>\u003cli>Feux de jour à DEL\u003c/li>\u003cli>Miroirs extérieurs chauffants à commande électrique\u003c/li>\u003cli>Vitres arrière teintées\u003c/li>\u003cli>Aileron arrière\u003c/li>\u003cli>Jantes en alliage élégantes\u003c/li>\u003cli>Garde au sol élevée\u003c/li>\u003cli>Style robuste et raffiné de VUS\u003c/li>\u003cli>Toit ouvrant électrique disponible\u003c/li>\u003c/ul>Intérieur confortable\u003cbr />\u003cul>\u003cli>Places assises pour cinq passagers\u003c/li>\u003cli>Sièges en tissu de qualité supérieure\u003c/li>\u003cli>Climatisation automatique à deux zones\u003c/li>\u003cli>Habitacle spacieux à l&#x27;avant et à l&#x27;arrière\u003c/li>\u003cli>Banquette arrière rabattable à plat\u003c/li>\u003cli>Grand espace de chargement\u003c/li>\u003cli>Espace de rangement généreux derrière les sièges arrière\u003c/li>\u003cli>Multiples compartiments de rangement\u003c/li>\u003cli>Confort idéal pour les trajets quotidiens et les longs voyages\u003c/li>\u003c/ul>Technologie et connectivité\u003cbr />\u003cul>\u003cli>Écran tactile multimédia Toyota Audio\u003c/li>\u003cli>Compatibilité Apple CarPlay® sans fil\u003c/li>\u003cli>Compatibilité Android Auto™ sans fil\u003c/li>\u003cli>Connectivité Bluetooth® mains libres\u003c/li>\u003cli>Compatibilité SiriusXM®\u003c/li>\u003cli>Système audio à six haut-parleurs\u003c/li>\u003cli>Multiples ports USB pour la recharge\u003c/li>\u003cli>Commandes vocales\u003c/li>\u003cli>Intégration des appareils intelligents\u003c/li>\u003cli>Écran d&#x27;information numérique du conducteur\u003c/li>\u003c/ul>Sécurité et assistance à la conduite\u003cbr />\u003cul>\u003cli>Toyota Safety Sense™ 2.5\u003c/li>\u003cli>Système précollision avec détection des piétons\u003c/li>\u003cli>Régulateur de vitesse adaptatif à radar dynamique pleine vitesse\u003c/li>\u003cli>Alerte de sortie de voie avec assistance à la direction\u003c/li>\u003cli>Assistance au maintien dans la voie\u003c/li>\u003cli>Reconnaissance des panneaux de signalisation\u003c/li>\u003cli>Phares de route automatiques\u003c/li>\u003cli>Caméra de recul\u003c/li>\u003cli>Contrôle de stabilité et de traction\u003c/li>\u003cli>Technologies avancées d&#x27;aide à la conduite\u003c/li>\u003c/ul>Pourquoi choisir le RAV4 Hybride Rechargeable SE AWD?\u003cbr />\u003cul>\u003cli>Excellente économie de carburant\u003c/li>\u003cli>Conduite 100 % électrique pour les déplacem
