# Searches the scheduled crawl runs (GitHub Actions .github/workflows/crawl.yml
# and scripts/crawl-and-push.ps1). Edit freely; the crawler checks this file
# and refuses unknown keys, so a typo cannot silently drop a filter.
#
#   go run ./cmd/carbuyer --searches searches.yml --no-score      # dry run, local SQLite only
#
# Politeness is built in: searches run one after another, one request at a
# time, at least `delaySeconds` apart (never less than 1.5 s), with a normal
# browser User-Agent, and the run stops at the first error.
# Keep it small: every run fetches about (searches x pages) pages, plus a few
# per site (Facebook: `pages` requests per city, Craigslist: up to 20 ad pages,
# CarGurus: `pages` per model year). This file is about 70 requests, ~4 min.
#
# `source` picks the site: autohebdo (default), kijiji, lespac, facebook,
# craigslist, cargurus. The sites that walk a whole region (kijiji, lespac,
# craigslist, cargurus) take no make/model. The most fragile sites go last,
# because the run stops at the first error.

delaySeconds: 3

# Applied to every search unless the search sets its own value.
defaults:
  geo: reg_on        # all of Ontario (AutoHebdo). Quebec: reg_qc
  seller: any        # any | dealer | private
  maxPrice: 30000    # price cap in CAD (server-side filter)
  pages: 2           # 20 listings per page
  newest: true       # newest listings first: new deals show up on page 1

# make / model are AutoHebdo URL slugs (as in autohebdo.net/autos/<make>/<model>).
# A wrong slug is detected and stops the run with a clear message.
# Optional per search: source, name, geo, seller, minPrice, maxPrice, minYear, maxYear, pages, newest.
# `geo` means something different on each site: see `carbuyer --help`.
searches:
  # Ontario.
  - make: toyota
    model: rav4
  - make: honda
    model: civic
  - make: toyota
    model: corolla
  - make: hyundai
    model: elantra
  - source: kijiji          # all of Ontario; price filter not supported, ignored
    geo: ontario
  - source: cargurus        # dealers only, but with CarGurus' own price estimate
    geo: toronto            # 100 km around Toronto
    minYear: 2020           # one request per model year: keep the range short
    pages: 1
  - source: craigslist
    geo: toronto            # also: ottawa, hamilton, kitchener, london, windsor ...
    pages: 1
  - source: facebook        # Marketplace, logged out; 2 requests per city, 14 cities
    geo: ontario
    pages: 2

  # Quebec, kept as a reference. Uncomment to watch it too; prices never mix,
  # the scorer keeps each province apart. Mind the 25-search limit.
  #  - make: toyota
  #    model: rav4
  #    geo: reg_qc
  #  - source: kijiji
  #    geo: quebec
  #  - source: lespac        # Quebec only, private sellers, 200 km around Montreal
  #    pages: 2
  #  - source: cargurus
  #    geo: montreal
  #    minYear: 2020
  #    pages: 1
  #  - source: craigslist
  #    geo: montreal
  #    pages: 1
  #  - source: facebook
  #    geo: quebec
  #    pages: 2

